[project]
name = "emberscan-workers"
version = "0.1.0"
description = "EmberScan pipeline workers: frames, segmentation, geometry, rules engine, agent."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.9,<3",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "httpx>=0.27,<1",
  "opencv-python-headless>=4.10,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emberscan_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/emberscan_workers/service.py" = ["B008"]  # FastAPI's File()/Form() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
